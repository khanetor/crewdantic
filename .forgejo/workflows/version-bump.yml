name: Version bump check

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  version-bump:
    runs-on: uv
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version is bumped
        run: |
          BASE=$(git show "origin/${{ github.base_ref }}:pyproject.toml" | grep -m1 '^version' | cut -d'"' -f2)
          HEAD=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "base version: $BASE, PR version: $HEAD"
          if [ "$HEAD" = "$BASE" ] || [ "$(printf '%s\n%s\n' "$BASE" "$HEAD" | sort -V | head -n 1)" != "$BASE" ]; then
            echo "::error::pyproject.toml version was not bumped ($BASE); bump it before merging to main"
            exit 1
          fi
