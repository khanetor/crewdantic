name: Test

on:
  push:

jobs:
  test:
    runs-on: uv
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: |
          uv sync
          uv run python -m unittest discover -s tests
          uvx --from ty==0.0.107 ty check --error all src tests examples
          uvx --from ruff==0.17.6 ruff check src tests examples
