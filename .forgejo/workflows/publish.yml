name: Publish to Codeberg package registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
jobs:
  publish:
    runs-on: uv
    steps:
      - uses: actions/checkout@v7

      - name: Tag release with pyproject version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists, skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Install project
        run: uv sync

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to Codeberg package registry
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if curl -sf "https://codeberg.org/api/v1/packages/khanetor/pypi/crewdantic/$VERSION" >/dev/null; then
            echo "version $VERSION is already published, skipping"
          else
            uv publish --publish-url https://codeberg.org/api/packages/khanetor/pypi
          fi
        env:
          UV_PUBLISH_USERNAME: khanetor
          UV_PUBLISH_PASSWORD: ${{ secrets.REPO_PASSWORD }}
