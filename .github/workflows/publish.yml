name: Publish to GitHub releases

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Tag release with pyproject version
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists, skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Upload packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --title "v$VERSION" --generate-notes
          fi
