name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Run unit tests
        run: |
          uv sync --locked
          uv run python -m unittest discover -s tests
          uvx ty check --error all src tests examples
          uvx ruff check src tests examples
